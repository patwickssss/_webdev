<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>League of Legends</title>
    <link rel="icon" href="../assets/imgs/Group 26.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #0a0a0b;
            --surface: #111113;
            --line: #2a2a2e;
            --line-strong: #5a5a60;
            --paper: #F1EAD8;
            --muted: #8d8d94;
        }



        .hero-image {
            position: relative;
            height: 100%;
        }

        .hero-image::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 150px;
            height: 100%;
            background: linear-gradient(to right, black, transparent);
            z-index: 1;
            pointer-events: none;
        }
    </style>
</head>

<body>
    <!-- Hero -->
    <div class="container-fluid " style="height: calc(100vh - 100px); background: rgb(0, 0, 0);">
        <div class="row h-100 position-relative">

            <div class="col-lg-5 p-0 position-absolute top-50 start-0 translate-middle-y z-1 text-end">
                <div class="display-1 fw-bold pe-4 text-white" style="font-family: 'Cinzel', serif;">
                    LEAGUE OF LEGENDS
                </div>
            </div>

            <div class="col-lg-7 p-0 ms-auto hero-image">
                <img class="w-100 h-100 object-fit-cover"
                    src="https://www.buff.game/wp-content/uploads/2021/03/Ahri_OriginalCentered.jpg"
                    alt="League of Legends">
            </div>

        </div>
    </div>

    <div class="container-fluid" style="height: 100vh; background: var(--surface);">
        <div class="row">
            <div class="col">

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

</body>

</html>
