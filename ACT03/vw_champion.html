<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Champion | League of Legends</title>

    <link rel="icon" href="../assets/imgs/Group 26.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

    <!-- Champion hero: the background image and text are filled from the detail API. -->
    <section class="champion-hero d-flex align-items-center" id="championHero">
        <div class="container py-5">
            <div class="row">
                <div class="col-lg-7 hero-content">
                    <a href="index.html" class="back-link small d-inline-block mb-4" id="backlink">
                        &larr; BACK TO CHAMPIONS
                    </a>

                    <div class="champion-subtitle text-uppercase" id="championTitle">Loading champion...</div>
                    <h1 class="champion-title text-uppercase my-2" id="championName">...</h1>
                    <p class="text-white-50" id="championLore"></p>
                </div>
            </div>
        </div>
    </section>

    <!-- Five ability entries: passive plus the four spells returned by Data Dragon. -->
    <section class="abilities-section py-5">
        <div class="container py-3">
            <div class="text-center mb-5">
                <h2 class="section-title">ABILITIES</h2>
            </div>

            <div class="row justify-content-center g-4" id="abilities">
                <div class="col-12 text-center text-secondary">Loading abilities...</div>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <script src="assets/js/vw_champion.js"></script>
</body>

</html>
