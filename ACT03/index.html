<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>League of Legends Champions</title>

    <link rel="icon" href="../assets/imgs/Group 26.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

    <!-- Main banner -->
    <div class="container-fluid" style="height: calc(100vh - 100px); background: rgb(0, 0, 0);">
        <div class="row h-100 position-relative">
            <div class="col-5 p-0 position-absolute top-50 start-0 translate-middle-y z-1 text-end">
                <div class="display-1 fw-bold pe-4 text-white" style="font-family: 'Cinzel', serif;">
                    LEAGUE OF LEGENDS
                </div>
            </div>

            <div class="col-7 p-0 ms-auto hero-image">
                <img class="w-100 h-100 object-fit-cover"
                    src="https://www.buff.game/wp-content/uploads/2021/03/Ahri_OriginalCentered.jpg"
                    alt="League of Legends">
            </div>
        </div>
    </div>

    <!-- Champion collection -->
    <div class="container py-5 champion-section" id="championSection">
        <div class="row mb-4">
            <div class="col-8">
                <div class="display-6 fw-bold" style="font-family: 'Cinzel', serif;">CHAMPIONS</div>
                <div class="text-secondary">League of Legends Champion Collection</div>
            </div>
            <div class="col-4">
                <form class="d-flex" id="searchForm">
                    <input class="form-control me-2 border border-secondary bg-transparent text-white" type="search"
                        id="searchInput" placeholder="Search champion's name or role..." aria-label="Search">
                    <button class="btn btn-outline-secondary text-white" type="submit">Search</button>
                </form>
            </div>
        </div>

        <div class="row g-4" id="parent"></div>
        <div id="paginationTrigger"></div>

        <nav class="pagination-popup" id="paginationNav" aria-label="Champion pagination">
            <ul class="pagination gap-2 justify-content-center mb-0" id="pagination"></ul>
        </nav>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <script src="assets/js/index.js"></script>
</body>

</html>
