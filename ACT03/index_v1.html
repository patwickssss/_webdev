<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>League of Legends</title>
    <link rel="icon" href="../assets/imgs/Group 26.svg">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #0a0a0b;
            --surface: #111113;
            --line: #2a2a2e;
            --line-strong: #5a5a60;
            --paper: #F1EAD8;
            --muted: #8d8d94;
        }

        body {
            background: var(--surface);
            color: var(--paper);
        }

        .hero-image {
            position: relative;
            height: 100%;
        }

        .hero-image::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 150px;
            height: 100%;
            background: linear-gradient(to right, black, transparent);
            z-index: 1;
            pointer-events: none;
        }

        .card {
            width: 100%;
            height: 200px;
            background: var(--surface);
            border: 1px solid var(--line);
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        /* Card Hover */
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
            border-color: var(--line-strong);
        }

        /* Champion Image */
        .champ-image {
            object-fit: cover;
            object-position: center;
            position: relative;
        }

        /* Shadow on the LEFT side of champion image */
        .champ-image {
            box-shadow: inset 20px 0 25px rgba(0, 0, 0, 0.8);
        }

        .champ-image-shadow {
            position: absolute;
            top: 0;
            left: 0;
            width: 300px;
            height: 100%;
            background: linear-gradient(to right, var(--surface), transparent);
            z-index: 1;
            pointer-events: none;
        }

        .champ-name {
            position: relative;
            z-index: 1;
            background: var(--surface);
            color: var(--paper);
        }

        /* Shadow on the RIGHT side of champion name */
        .champ-name::after {
            content: "";
            position: absolute;
            top: 0;
            right: -40px;
            width: 40px;
            height: 100%;
            background: linear-gradient(to right, var(--surface), transparent);
            z-index: 2;
            pointer-events: none;
        }

        .page-link {
            background: var(--surface);
            color: var(--paper);
            border-color: var(--line);
            cursor: pointer;
        }

        .page-link:hover {
            background: var(--line);
            color: white;
        }

        .page-item.active .page-link {
            background: var(--paper);
            color: black;
            border-color: var(--paper);
        }
    </style>
</head>

<body>

    <!-- Hero -->
    <div class="container-fluid" style="height: calc(100vh - 100px); background: rgb(0, 0, 0);">
        <div class="row h-100 position-relative">

            <div class="col-lg-5 p-0 position-absolute top-50 start-0 translate-middle-y z-1 text-end">
                <div class="display-1 fw-bold pe-4 text-white" style="font-family: 'Cinzel', serif;">
                    LEAGUE OF LEGENDS
                </div>
            </div>

            <div class="col-lg-7 p-0 ms-auto hero-image">
                <img class="w-100 h-100 object-fit-cover"
                    src="https://www.buff.game/wp-content/uploads/2021/03/Ahri_OriginalCentered.jpg"
                    alt="League of Legends">
            </div>

        </div>
    </div>

    <!-- Champion List -->
    <div class="container py-5">

        <div class="row mb-4">
            <div class="col">
                <div class="display-6 fw-bold" style="font-family: 'Cinzel', serif;">
                    CHAMPIONS
                </div>
                <div class="text-secondary">
                    League of Legends Champion Collection
                </div>
            </div>
        </div>

        <!-- Pagination -->
        <nav aria-label="Champion pagination">
            <ul class="pagination">
                <li class="page-item">
                    <a class="page-link" onclick="prev()">Previous</a>
                </li>
                <li class="page-item active">
                    <a class="page-link" id="currentPage">1</a>
                </li>
                <li class="page-item">
                    <a class="page-link" onclick="next()">Next</a>
                </li>
            </ul>
        </nav>

        <!-- Champions -->
        <div class="row g-4" id="parent">

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <script>

        // API
        const api = 'https://ddragon.leagueoflegends.com/cdn/16.21.1/data/en_US/champion.json';

        // Pagination
        const queryString = window.location.search;
        const urlParams = new URLSearchParams(queryString);

        var page = Number(urlParams.get('page')) || 1;

        var perPageLoad = 20;
        var totalChampions = 0;
        var lastPage = 1;

        // Elements
        var elParent = document.getElementById("parent");
        var elCurrentPage = document.getElementById("currentPage");

        // Capitalize First Letter
        function capitalizeFirstLetter(str) {
            if (!str) return str;
            return str.charAt(0).toUpperCase() + str.slice(1);
        }

        // Get Champions
        const getChampions = async () => {

            elParent.innerHTML = `
                <div class="col-12 text-center py-5">
                    <div class="spinner-border text-light"></div>
                    <div class="mt-2 text-secondary">Loading champions...</div>
                </div>
            `;

            try {

                var response = await fetch(api);
                var result = await response.json();

                // Convert API data into an array
                var champions = Object.values(result.data);

                // Sort champions alphabetically
                champions.sort((a, b) => a.name.localeCompare(b.name));

                totalChampions = champions.length;
                lastPage = Math.ceil(totalChampions / perPageLoad);

                // Check page number
                if (page < 1 || page > lastPage) {
                    page = 1;
                }

                // Display current page
                elParent.innerHTML = '';
                elCurrentPage.innerHTML = page;

                // Pagination range
                var start = perPageLoad * (page - 1);
                var end = Math.min(start + perPageLoad, totalChampions);

                // Loop through champions
                for (var i = start; i < end; i++) {

                    var champion = champions[i];

                    var id = champion.id;
                    var name = champion.name;
                    var title = champion.title;
                    var tags = champion.tags;

                    // Champion splash art
                    var picture = 'https://ddragon.leagueoflegends.com/cdn/img/champion/splash/' + id + '_0.jpg';

                    elParent.innerHTML += `
                        <div class="col-12 col-md-6">
                            <div class="card shadow-sm">
                                <div class="row g-0 h-100">

                                    <div class="col-5 d-flex flex-column justify-content-center align-items-end champ-name p-2">
                                        <div class="h1 text-end mb-1">
                                            ${name}
                                        </div>
                                        <div class="small text-secondary text-end">
                                            ${title}
                                        </div>
                                        <div class="small text-secondary text-end mt-2">
                                            ${tags.join(' / ')}
                                        </div>
                                    </div>

                                    <div class="col-7 p-0 position-relative overflow-hidden">
                                        <div class="champ-image-shadow"></div>
                                        <img src="${picture}"
                                            class="w-100 h-100 champ-image"
                                            alt="${name}">
                                    </div>

                                </div>
                            </div>
                        </div>
                    `;

                }

                // Update URL
                window.history.replaceState(null, '', '?page=' + page);

            } catch (error) {

                elParent.innerHTML = `
                    <div class="col-12 text-center text-danger py-5">
                        Failed to load champions. Please try again.
                    </div>
                `;

                console.error('API Error:', error);

            }

        }

        // Previous Page
        function prev() {

            page -= 1;

            if (page < 1) {
                page = lastPage;
            }

            getChampions();

        }

        // Next Page
        function next() {

            page += 1;

            if (page > lastPage) {
                page = 1;
            }

            getChampions();

        }

        // Initial Load
        getChampions();

    </script>

</body>

</html>
